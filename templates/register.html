{% extends "base.html" %}
{% block content %}
<div class="auth-card"><h1>Create your account</h1>
  <form method="post">
    <label>Username<input name="username" required></label>
    <label>Password<input name="password" type="password" required></label>
    <button class="btn primary" type="submit">Register</button>
  </form>
  <p class="muted">Have an account? <a href="{{ url_for('login') }}">Log in</a></p>
</div>{% endblock %}
